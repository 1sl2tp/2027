<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2027 · CHAT phân cấp</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#242424;background:#f5f5f5}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3572d4;outline-offset:2px}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:white;border-bottom:1px solid #e7e7e7;gap:12px}.toolbar h1{font-size:16px;margin:0}.toolbar small{color:#666}.toolbar button,.icon{min-width:40px;min-height:40px;border-radius:12px}.toolbar button{background:#f0f0f0;padding:0 12px}.layout{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(0,250px);height:calc(100dvh - 63px);max-width:1600px;margin:auto;background:white}.directory,.thread,.utility{min-width:0;min-height:0;display:flex;flex-direction:column}.directory{border-right:1px solid #e7e7e7}.utility{border-left:1px solid #e7e7e7;padding:16px;gap:12px}.panel-title{padding:18px 16px 10px;font-weight:700}.search{margin:8px 12px 12px;border-radius:12px;border:1px solid #ddd;padding:12px;width:calc(100% - 24px)}.contacts{overflow-y:auto;min-height:0;flex:1}.contact{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:12px;border-bottom:1px solid #f3f3f3}.contact[aria-current="true"]{background:#f2f2f2}.avatar{width:38px;height:38px;border-radius:50%;background:#e8e8e8;display:grid;place-items:center;flex:none}.contact-info{min-width:0;flex:1}.contact-info strong,.contact-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.contact-info small{color:#777;margin-top:4px}.chat-header{height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #eee}.chat-header strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.messages{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px clamp(12px,4vw,48px);display:flex;flex-direction:column;gap:18px}.message{max-width:min(80%,580px);line-height:1.5;overflow-wrap:anywhere}.message.self{align-self:flex-end;background:#f0f0f0;border-radius:20px;padding:12px 15px}.message.other{align-self:flex-start}.message small{display:block;color:#777;font-size:11px;margin-top:5px}.message-actions{display:flex;gap:4px;margin-top:8px}.message-actions button{background:#f3f3f3;border-radius:8px;padding:7px;font-size:12px}.media{display:grid;place-items:center;width:170px;height:110px;background:#eaeaea;border-radius:12px;margin-top:8px}.composer{border-top:1px solid #eee;padding:10px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:end}.composer textarea{flex:1;min-width:0;max-height:140px;min-height:44px;resize:vertical;border:1px solid #ddd;border-radius:18px;padding:11px 13px}.composer button{background:#efefef;min-height:44px;min-width:44px;border-radius:14px}.reply{padding:8px 16px;background:#f6f6f6;font-size:13px}.overlay{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:10}.overlay[hidden],[hidden]{display:none!important}.sheet{width:min(420px,100%);background:white;border-radius:18px;padding:18px;max-height:80dvh;overflow:auto}.sheet button{display:block;width:100%;padding:13px;border-bottom:1px solid #eee;text-align:left}.note{color:#666;font-size:13px;line-height:1.5}.mobile-back{display:none}@media(max-width:900px){.layout{grid-template-columns:260px minmax(0,1fr)}.utility{display:none}}@media(max-width:600px){.layout{display:block;height:calc(100dvh - 63px)}.directory,.thread{height:100%}.layout[data-view="directory"] .thread{display:none}.layout[data-view="thread"] .directory{display:none}.mobile-back{display:block}.chat-header{height:54px}.messages{padding:16px 14px}.composer{padding-bottom:max(10px,env(safe-area-inset-bottom))}.message{max-width:87%}}
</style></head><body>
<header class="toolbar"><div><h1>2027 · CHAT phân cấp</h1><small>RULE 12 · Bản thử cục bộ, không gửi tin thật</small></div><button id="device">Mobile / Rộng</button></header>
<main class="layout" id="layout" data-view="directory">
<section class="directory" data-ui-component="CHAT-DIRECTORY"><div class="panel-title">Danh bạ</div><input class="search" id="search" placeholder="Tìm khách hàng" aria-label="Tìm khách"><nav class="contacts" id="contacts" aria-label="Danh bạ"></nav></section>
<section class="thread" data-ui-component="CHAT-THREAD"><header class="chat-header" data-ui-component="CHAT-REGION-TOP"><button class="icon mobile-back" id="back" aria-label="Quay về danh bạ">←</button><span class="avatar">◉</span><strong id="name"></strong><button class="icon" id="call" aria-label="Gọi thử">♧</button><button class="icon" id="more" aria-label="Menu hội thoại">⋯</button></header><div class="messages" id="messages" data-ui-component="CHAT-MESSAGE-LIST"></div><div class="reply" id="reply" hidden></div><form class="composer" id="composer" data-ui-component="CHAT-COMPOSER"><button type="button" id="attach" aria-label="Đính kèm">＋</button><textarea id="draft" rows="1" placeholder="Nhắn tin..." aria-label="Nội dung tin"></textarea><button type="submit" aria-label="Gửi bản thử">↑</button></form></section>
<aside class="utility" data-ui-component="CHAT-WORK-REGION"><strong>Tiện ích theo ngữ cảnh</strong><div class="note">Chỉ xuất hiện khi đủ không gian. Công việc, media và thông tin khách không chen vào vùng gõ.</div><button id="mediaLibrary">Ảnh và tệp đã chia sẻ</button></aside>
</main><div class="overlay" id="overlay" hidden role="presentation"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="overlayTitle"><strong id="overlayTitle">Thao tác</strong><div id="overlayBody"></div><button id="closeOverlay">Đóng</button></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const people=[{id:'a',name:'Khách hàng A',preview:'Đã gửi danh sách hàng'},{id:'b',name:'Khách hàng B với tên rất dài để thử căn lề',preview:'Có ảnh cần đối chiếu'},{id:'c',name:'Khách hàng C',preview:'Hẹn trao đổi sau'}];const state={selected:'a',reply:null,view:'directory',messages:{a:[{id:'a1',from:'other',text:'Chào bạn, mình cần kiểm tra danh sách hàng.'},{id:'a2',from:'self',text:'Mình đã nhận thông tin.'}],b:[{id:'b1',from:'other',text:'Đây là ảnh minh họa',media:true}],c:[{id:'c1',from:'other',text:'Cảm ơn bạn.'}]},drafts:{a:'',b:'',c:''}};let closeReturn=null;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function renderContacts(){const list=$('contacts');list.replaceChildren();const q=$('search').value.toLocaleLowerCase('vi');people.filter(p=>p.name.toLocaleLowerCase('vi').includes(q)).forEach(p=>{const b=el('button','contact');b.setAttribute('aria-current',String(state.selected===p.id));b.append(el('span','avatar','◉'));const info=el('span','contact-info');info.append(el('strong','',p.name),el('small','',p.preview));b.append(info);b.onclick=()=>select(p.id);list.append(b)})}
function select(id){state.drafts[state.selected]=$('draft').value;state.selected=id;state.reply=null;$('reply').hidden=true;$('draft').value=state.drafts[id]||'';state.view='thread';$('layout').dataset.view='thread';renderContacts();renderMessages()}
function renderMessages(){const p=people.find(x=>x.id===state.selected);$('name').textContent=p.name;const box=$('messages');box.replaceChildren();(state.messages[state.selected]||[]).forEach(m=>{const row=el('article','message '+(m.from==='self'?'self':'other'));row.dataset.messageId=m.id;row.dataset.uiComponent='CHAT-MESSAGE';row.append(el('div','',m.text));if(m.media){const media=el('button','media','▧ Ảnh mẫu');media.setAttribute('aria-label','Xem ảnh mẫu');media.onclick=()=>openOverlay('Xem media', [['Đóng ảnh',closeOverlay]]);row.append(media)}row.append(el('small','',m.from==='self'?'Đã tạo trong bản thử':'Tin mẫu'));const actions=el('div','message-actions');[['Trả lời',()=>{state.reply=m.id;$('reply').hidden=false;$('reply').textContent='Trả lời: '+m.text;$('draft').focus()}],['Sao chép',()=>{if(navigator.clipboard)navigator.clipboard.writeText(m.text).catch(()=>{});} ],['Chuyển tiếp',()=>forward(m)],['Chia sẻ',()=>share(m)]].forEach(([label,fn])=>{const b=el('button','',label);b.onclick=fn;actions.append(b)});row.append(actions);box.append(row)});box.scrollTop=box.scrollHeight}
function openOverlay(title,actions){closeReturn=document.activeElement;$('overlayTitle').textContent=title;const body=$('overlayBody');body.replaceChildren();actions.forEach(([label,fn])=>{const b=el('button','',label);b.onclick=fn;body.append(b)});$('overlay').hidden=false;$('closeOverlay').focus()}
function closeOverlay(){$('overlay').hidden=true;closeReturn?.focus?.()}
function forward(m){openOverlay('Chuyển tiếp đến khách (bản thử)',people.filter(p=>p.id!==state.selected).map(p=>[p.name,()=>{state.messages[p.id].push({id:'f'+Date.now(),from:'self',text:'Đã chuyển tiếp: '+m.text,media:!!m.media});closeOverlay()}]))}
function share(m){openOverlay('Chia sẻ (mô phỏng)',[['Sao chép nội dung',()=>{if(navigator.clipboard)navigator.clipboard.writeText(m.text).catch(()=>{});closeOverlay()}],['Đóng',closeOverlay]])}
$('search').oninput=renderContacts;$('back').onclick=()=>{state.drafts[state.selected]=$('draft').value;state.view='directory';$('layout').dataset.view='directory';renderContacts()};$('composer').onsubmit=e=>{e.preventDefault();const text=$('draft').value.trim();if(!text)return;state.messages[state.selected].push({id:'local'+Date.now(),from:'self',text:state.reply?'↪ '+state.reply+'\n'+text:text});$('draft').value='';state.drafts[state.selected]='';state.reply=null;$('reply').hidden=true;renderMessages()};$('attach').onclick=()=>openOverlay('Đính kèm (bản thử)',[['Thêm ảnh mẫu',()=>{state.messages[state.selected].push({id:'img'+Date.now(),from:'self',text:'Ảnh minh họa',media:true});closeOverlay();renderMessages()}]]);$('more').onclick=()=>openOverlay('Hội thoại',[['Tìm trong hội thoại',()=>{closeOverlay();$('draft').focus()}],['Đóng',closeOverlay]]);$('call').onclick=()=>openOverlay('Gọi',[['Chỉ là mẫu giao diện, không thực hiện cuộc gọi',closeOverlay]]);$('mediaLibrary').onclick=()=>openOverlay('Ảnh và tệp',[['Đóng',closeOverlay]]);$('closeOverlay').onclick=closeOverlay;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeOverlay()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeOverlay()});$('device').onclick=()=>{document.body.classList.toggle('force-mobile');const old=document.getElementById('deviceStyle');if(old)old.remove();else{const style=el('style');style.id='deviceStyle';style.textContent='body.force-mobile .layout{display:block;max-width:430px;height:calc(100dvh - 63px)}body.force-mobile .directory,body.force-mobile .thread{height:100%}body.force-mobile .layout[data-view="directory"] .thread,body.force-mobile .layout[data-view="thread"] .directory,body.force-mobile .utility{display:none}body.force-mobile .mobile-back{display:block}';document.head.append(style)}};renderContacts();renderMessages()})();
</script></body></html>
