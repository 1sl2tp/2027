name: Preview 2027 UI Library
on:
  push:
    branches: [main]
    paths: ["index.html", "flows.html", "base.html", "github-sources.html", "web/**", "RULES.md", "package.json", "tsconfig.json", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 2027-web-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run verify
      - name: Validate shared icon sprite XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('web/icons.svg')"
      - name: Package standalone Web preview
        run: |
          mkdir -p _site/web
          cp index.html flows.html base.html _site/
          cp github-sources.html _site/
          cp web/styles.css _site/web/
          cp web/icons.svg _site/web/
          cp web/button-thumbnail.svg _site/web/
          cp -R web/dist _site/web/
          # Isolate all ES imports under a new URL: old relative module URLs remain cached otherwise.
          cp -R web/dist _site/web/dist-v40
          cp -R web/dist _site/web/dist-v41
          cp -R web/dist _site/web/dist-v42
          cp -R web/dist _site/web/dist-v43
          cp -R web/dist _site/web/dist-v44
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
