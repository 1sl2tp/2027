name: Verify 2027 UI Pull Requests
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "web/**"
      - "RULES.md"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run verify
      - name: Validate 2027 icon sprite
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('web/icons.svg')"
