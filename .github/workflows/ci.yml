name: Verify 2027 UI pull request
on:
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - "README.md"
      - "chat-gallery.html"
      - "index.html"
      - "github-sources.html"
      - "base.html"
      - "flows.html"
      - "web/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/pages.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Check installed Modern Web Guidance (offline search)
        env:
          DISABLE_TELEMETRY: "1"
        run: npm run guidance:search -- "responsive data table"
      - run: npm run verify
      - name: Validate shared icon sprite XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('web/icons.svg')"
